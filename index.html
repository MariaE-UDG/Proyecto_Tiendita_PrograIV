<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendita - TrendMode MX</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- LIBRERÍA CHART.JS (TAREA EXTRA) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Estilos personalizados para igualar la imagen */
        body {
            background-color: #f8f9fa; /* Fondo gris muy claro */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }

        .card {
            border: none;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04); /* Sombra muy sutil */
            border-radius: 12px;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .form-label {
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }

        .form-control {
            background-color: #fcfcfc;
            border: 1px solid #e0e0e0;
            padding: 0.6rem 1rem;
            border-radius: 8px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
            border-color: #0d6efd;
        }

        .btn-primary {
            background-color: #2563eb; /* Azul más moderno */
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Estilos de la tabla */
        .table thead th {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .table tbody td {
            padding: 1rem 0.5rem;
            vertical-align: middle;
            border-bottom: 1px solid #f8f9fa;
            font-size: 0.95rem;
        }

        /* Badges de cantidad */
        .badge-stock {
            padding: 0.4em 0.8em;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .bg-stock-ok { background-color: #d1e7dd; color: #0f5132; }
        .bg-stock-low { background-color: #f8d7da; color: #842029; }

        /* Botones de acción pequeños */
        .btn-action {
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        
        .btn-outline-blue {
            color: #0d6efd;
            border-color: #0d6efd;
            background-color: transparent;
        }
        .btn-outline-blue:hover {
            background-color: #0d6efd;
            color: white;
        }

        .btn-outline-red {
            color: #dc3545;
            border-color: #dc3545;
            background-color: transparent;
        }
        .btn-outline-red:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body class="mt-5 mb-5">

    <div class="container">
        <!-- FILA 1: Formulario y Tabla -->
        <div class="row g-4">
            
            <!-- Formulario de Registro (Izquierda) -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header">
                        Registrar Producto
                    </div>
                    <div class="card-body p-4">
                        <form id="formProducto">
                            <div class="mb-4">
                                <label for="nombre" class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Pantalón Mezclilla" required>
                            </div>
                            <div class="mb-4">
                                <label for="precio" class="form-label">Precio ($)</label>
                                <input type="number" step="0.5" class="form-control" id="precio" placeholder="699.00" required>
                            </div>
                            <div class="mb-4">
                                <label for="cantidad" class="form-label">Cantidad Disponible</label>
                                <input type="number" class="form-control" id="cantidad" placeholder="10" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-2">
                                Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Inventario (Derecha) -->
            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Catálogo de Productos</span>
                        <!-- Badge contador estilo píldora -->
                        <span class="badge bg-dark rounded-pill" id="totalProductos" style="font-weight: 500;">0 productos</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos">
                                    <!-- Se llena con JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- FILA 2: Gráfico de Chart.js (TAREA EXTRA) -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Ventas Totales por Categoría (MXN)</span>
                        <span class="badge bg-primary rounded-pill" style="font-weight: 500;">Datos del CSV</span>
                    </div>
                    <div class="card-body p-4">
                        <!-- Aquí se dibuja el gráfico -->
                        <canvas id="graficoVentas" style="max-height: 350px; width: 100%;"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo JS -->
    <script src="app.js"></script>
</body>
</html>
