<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendMode MX - Tiendita</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- PALETA DE COLORES ROJO/NARANJA --- */
        :root {
            --color-primario: #ea580c;
            --color-primario-hover: #c2410c;
            --color-secundario: #dc2626;
            --color-fondo: #fff7ed;
            --color-texto: #431407;
        }

        body {
            background-color: var(--color-fondo);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--color-texto);
        }

        .card {
            border: none;
            box-shadow: 0 4px 20px rgba(234, 88, 12, 0.08);
            border-radius: 12px;
            background: #ffffff;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 2px solid #ffedd5;
            padding: 1.2rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primario);
        }

        .form-label {
            font-size: 0.9rem;
            color: #9a3412;
            font-weight: 600;
        }

        .form-control {
            background-color: #fffaf5;
            border: 1px solid #fed7aa;
            padding: 0.6rem 1rem;
            border-radius: 8px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
            border-color: var(--color-primario);
        }

        .btn-primary {
            background-color: var(--color-primario);
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--color-primario-hover);
            transform: translateY(-1px);
        }

        /* --- TABS DE CATEGORÍAS --- */
        .nav-tabs {
            border-bottom: 2px solid #ffedd5;
            background-color: #fff;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding-top: 0.5rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .nav-tabs::-webkit-scrollbar {
            height: 6px;
        }
        .nav-tabs::-webkit-scrollbar-thumb {
            background: #fdba74;
            border-radius: 3px;
        }

        .nav-tabs .nav-link {
            color: #9a3412;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 0.6rem 1rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .nav-tabs .nav-link:hover {
            color: var(--color-primario);
            background-color: #fff7ed;
            border-bottom-color: #fdba74;
        }

        .nav-tabs .nav-link.active {
            color: var(--color-primario);
            background-color: #fff;
            border-bottom: 3px solid var(--color-primario);
            font-weight: 700;
        }

        .nav-tabs .nav-link .badge-tab {
            background-color: #ffedd5;
            color: #9a3412;
            font-size: 0.7rem;
            margin-left: 0.3rem;
            padding: 0.15em 0.5em;
        }

        .nav-tabs .nav-link.active .badge-tab {
            background-color: var(--color-primario);
            color: white;
        }

        /* --- TABLA --- */
        .table thead th {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #9a3412;
            font-weight: 700;
            border-bottom: 2px solid #ffedd5;
            background-color: #fff;
            padding-top: 1rem;
            padding-bottom: 1rem;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .table tbody td {
            padding: 1rem 0.5rem;
            vertical-align: middle;
            border-bottom: 1px solid #fff7ed;
            font-size: 0.95rem;
        }

        .badge-stock {
            padding: 0.4em 0.8em;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .bg-stock-ok { background-color: #ffedd5; color: #9a3412; }
        .bg-stock-low { background-color: #fee2e2; color: #b91c1c; }

        .btn-action {
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid transparent;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-outline-primary {
            color: var(--color-primario);
            border-color: var(--color-primario);
        }
        .btn-outline-primary:hover {
            background-color: var(--color-primario);
            color: white;
        }

        .btn-outline-danger {
            color: var(--color-secundario);
            border-color: var(--color-secundario);
        }
        .btn-outline-danger:hover {
            background-color: var(--color-secundario);
            color: white;
        }

        /* --- KPIs --- */
        .kpi-card {
            text-align: center;
            padding: 1.5rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(234, 88, 12, 0.08);
            border-top: 4px solid var(--color-primario);
        }
        .kpi-title {
            font-size: 0.85rem;
            color: #9a3412;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .kpi-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-secundario);
            margin-top: 0.5rem;
        }

        /* --- SCROLLBAR --- */
        .table-responsive::-webkit-scrollbar {
            width: 8px;
        }
        .table-responsive::-webkit-scrollbar-track {
            background: #fff7ed;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: #fdba74;
            border-radius: 4px;
        }
    </style>
</head>
<body class="mt-4 mb-5">
    <div class="container">

        <!-- TARJETAS DE KPIs -->
        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-title">Ingresos Totales</div>
                    <div class="kpi-value" id="kpiIngresos">$0.00</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-title">Transacciones</div>
                    <div class="kpi-value" id="kpiTransacciones">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kpi-card">
                    <div class="kpi-title">Producto Estrella</div>
                    <div class="kpi-value" id="kpiProducto" style="font-size: 1.4rem;">N/A</div>
                </div>
            </div>
        </div>

        <!-- FILA 1: Formulario y Catálogo con Tabs -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-plus-circle me-2"></i> Registrar Producto
                    </div>
                    <div class="card-body p-4">
                        <form id="formProducto">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Vestido Liso" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio ($)</label>
                                <input type="number" step="0.5" class="form-control" id="precio" placeholder="0.00" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cantidad</label>
                                <input type="number" class="form-control" id="cantidad" placeholder="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <input type="text" class="form-control" id="categoria" placeholder="Ej. Vestidos" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save me-2"></i> Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-box-seam me-2"></i> Catálogo por Categoría</span>
                        <span class="badge rounded-pill" style="background-color: var(--color-primario); font-size: 0.9rem;" id="totalProductos">0</span>
                    </div>

                    <!-- Tabs de categorías -->
                    <ul class="nav nav-tabs px-2" id="tabsCategorias" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-categoria="" type="button">
                                <i class="bi bi-grid-fill me-1"></i>Todas
                                <span class="badge badge-tab" id="badgeTodas">0</span>
                            </button>
                        </li>
                        <!-- Las demás tabs se generan dinámicamente -->
                    </ul>

                    <!-- Tabla de productos -->
                    <div class="card-body p-0 table-responsive" style="max-height: 420px; overflow-y: auto;">
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Categoría</th>
                                    <th>Cantidad</th>
                                    <th class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILA 2: Gráficas -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-bar-chart-fill me-2"></i> Ventas por Producto
                    </div>
                    <div class="card-body">
                        <canvas id="graficoCategoria" style="max-height: 300px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-graph-up-arrow me-2"></i> Evolución por Fecha
                    </div>
                    <div class="card-body">
                        <canvas id="graficoFecha" style="max-height: 300px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo JS -->
    <script src="app.js"></script>
</body>
</html>
